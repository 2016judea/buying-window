<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buying Window</title>
<meta name="description" content="Pick what you sell. See the Minneapolis businesses that just started needing it, from public records: build-outs, new liquor licenses, first health inspections, teardowns and layoff notices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1b1a17; --muted:#6b675e; --line:#e3dfd5;
  --accent:#1f5f4a; --accent-ink:#ffffff; --chip:#ece8de;
  --t-buildout:#2f5d8a; --t-liquor:#8a3f6a; --t-first_inspection:#1f7a4a; --t-wrecking:#8a5a1f; --t-warn:#8a2f2f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1f1e1b; --ink:#f1eee7; --muted:#a39e93; --line:#33312c;
    --accent:#5fbf98; --accent-ink:#0e1a15; --chip:#2a2925;
    --t-buildout:#7fb0e0; --t-liquor:#e09ac4; --t-first_inspection:#7fd3a3; --t-wrecking:#e0b47f; --t-warn:#e48b8b;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1f1e1b; --ink:#f1eee7; --muted:#a39e93; --line:#33312c;
  --accent:#5fbf98; --accent-ink:#0e1a15; --chip:#2a2925;
  --t-buildout:#7fb0e0; --t-liquor:#e09ac4; --t-first_inspection:#7fd3a3; --t-wrecking:#e0b47f; --t-warn:#e48b8b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
.brand{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--accent);padding:16px 0 4px}
.nav{padding:8px 0 10px;border-bottom:1px solid var(--line)}
.ask{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips+.chips{margin-top:8px}
.c{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;cursor:pointer;min-height:44px;white-space:nowrap}
.c[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c.cat{font-weight:600}
.c[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.c b{font-weight:600;opacity:.7;margin-left:6px}
.hero{padding:18px 0 6px}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
h1{font-size:24px;line-height:1.2;margin:6px 0 4px;letter-spacing:-.01em}
.sub2{color:var(--muted);margin:0 0 12px}
.dl{display:inline-flex;align-items:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:10px 14px;border-radius:10px;min-height:44px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 12px;padding:0 16px}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:40px}
.f[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:14px 14px 12px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.when{font-size:13px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.new{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.name{font-weight:700;font-size:21px;line-height:1.2;margin:6px 0 0;overflow-wrap:anywhere}
.who{font-weight:600;font-size:16px;margin:2px 0 0;overflow-wrap:anywhere}
.addr{color:var(--muted);margin:2px 0 0}
.pitch{font-size:16px;margin:10px 0 0;padding:10px 12px;background:var(--chip);border-radius:10px}
.pitch strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.ask2{font-size:15px;margin:8px 0 0}
details{margin:8px 0 0;font-size:14px;color:var(--muted)}
summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}
details p{margin:4px 0 6px;overflow-wrap:anywhere}
details a{color:var(--accent)}
.me{display:inline-flex;align-items:baseline;gap:8px;border:0;border-bottom:3px solid var(--accent);background:none;color:var(--ink);font:inherit;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;padding:0 0 2px;cursor:pointer;text-align:left}
.caret{font-size:18px;color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:8px 16px 24px}
.ph{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0}
.x{border:0;background:none;color:var(--ink);font-size:28px;min-width:44px;min-height:44px;cursor:pointer}
.o{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:17px;padding:14px 4px;min-height:52px;cursor:pointer}
.o b{color:var(--muted);font-weight:600}
.o[aria-current=true]{color:var(--accent);font-weight:700}
.story{font-size:16px;margin:10px 0 0}
.foryou{font-size:15px;margin:10px 0 0;padding:10px 12px;background:var(--chip);border-radius:10px}
.foryou strong{color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">BUYING WINDOW · MINNEAPOLIS</div>
  <section class="hero">
    <p class="ask">What do you sell?</p>
    <button class="me" id="me" aria-haspopup="dialog"><span id="metext"></span> <span class="caret">&#9662;</span></button>
    <h1 id="headline"></h1>
    <p class="sub2" id="sub2"></p>
    <a class="dl" id="csv" download>Download the list (CSV)</a>
  </section>
  <div id="rows"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="What do you sell?" hidden>
    <div class="panel"><div class="ph"><b>What do you sell?</b><button class="x" id="x" aria-label="Close">&times;</button></div>
    <div id="opts"></div></div>
  </div>
  <footer id="foot"></footer>
</div>
<script>
(async function(){
  const D = await (await fetch('data/events.json')).json();
  const T = D.triggers, E = D.events;
  const built = new Date(D.built + 'T12:00:00');
  const fmt = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  const weekAgo = new Date(built.getTime() - 7*864e5).toISOString().slice(0,10);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const matches = (t, e) => t.triggers.some(([ev, segs]) => e.event === ev && (!segs.length || segs.includes(e.segment)));
  const DEFAULT = 'bookkeeping';

  // plain-English timing, the first thing after "what is it"
  const WHEN = {'Under construction':'Still building', 'Final inspection, opening soon':'Opening soon',
    'Construction done, opening now':'Opening now', 'Open now':'Just opened', 'License approved':'License approved',
    'License pending, not open yet':'Not open yet', 'Permit open, building still standing':'Coming down soon',
    'Torn down':'Just torn down', 'Closing':'Closing', 'Layoffs':'Layoffs'};
  const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
  function title(e){
    if (e.event === 'wrecking') return e.stage === 'Torn down' ? e.type.replace('coming down', 'torn down') : e.type;
    if (e.event === 'warn') return e.type;
    if (e.type === 'Commercial space') return e.kind === 'Remodel' ? 'Business remodeling its space' : 'New business moving in';
    if (e.event === 'buildout' && e.kind === 'Remodel') return `${e.type} remodeling`;
    return `New ${lc(e.type)}`;
  }
  // the facts of THIS lead, in one or two plain sentences
  function story(e){
    const on = fmt(e.date), at = e.address ? ` at ${e.address}` : '';
    const a = lc(title(e)).replace(/^new /, 'new ');
    const it = e.name || `A ${a}`;
    switch (e.event){
      case 'buildout': {
        const what = e.type === 'Commercial space' ? (e.kind === 'Remodel' ? 'A business is remodeling' : 'A new business is moving in')
          : e.kind === 'Remodel' ? `${e.name || 'A ' + lc(e.type)} is remodeling` : `${e.name || 'A new ' + lc(e.type)} is moving in`;
        if (e.stage.startsWith('Construction done')) return `${what}${at}. Construction wrapped up ${on}, so the doors open any day now.`;
        if (e.stage.startsWith('Final')) return `${what}${at}. The space is at final inspection, so opening is weeks away.`;
        return `${what}${at}. The permit was issued ${on} and construction is underway, so vendors get picked before opening day.`;
      }
      case 'liquor': return e.stage.startsWith('License pending')
        ? `${it} applied for a brand-new liquor license and is not open yet.`
        : `${it} got a brand-new liquor license on ${on}. That usually means a new place or new owners.`;
      case 'first_inspection': return `${it} had its first-ever city health inspection on ${on}. It just opened its doors.`;
      case 'wrecking': return e.stage === 'Torn down'
        ? `A commercial building${at} was torn down ${on}. The lot is about to become something new.`
        : `A commercial building${at} has a wrecking permit from ${on} and is still standing.`;
      case 'warn': return `${e.name} told the state it is ${e.stage.startsWith('Closing') ? 'closing a site' : 'laying people off'}${e.city ? ' in ' + e.city : ''} (notice dated ${on}). ${e.detail}.`;
    }
    return '';
  }
  function askFor(e){
    if (e.event === 'buildout' && e.by) return `<p class="ask2">Who to ask: <b>${esc(e.by)}</b> filed the permit and knows the owner.</p>`;
    if (e.event === 'wrecking' && e.by) return `<p class="ask2">Who to ask: <b>${esc(e.by)}</b> is doing the teardown.</p>`;
    if (e.name && e.event !== 'warn') return `<p class="ask2">Who to ask: the owner or manager at <b>${esc(e.name)}</b>.</p>`;
    return '';
  }

  document.getElementById('foot').innerHTML =
    `Updated ${fmt(D.built)} from public records: Minneapolis building permits, liquor licenses and food inspections, and Minnesota layoff notices. ` +
    `Free. No sign-up. <a href="https://github.com/2016judea/buying-window">How it works</a>.`;

  // one row of trades, most leads first; the open one leads the row
  const ORDER = [...D.trades].sort((a, b) => b.count - a.count);

  function draw(t){
    // categories, then the trades inside the open one
    document.getElementById('metext').textContent = t.me + '.';
    document.getElementById('opts').innerHTML = ORDER.map(x =>
      `<button class="o" data-slug="${x.slug}" aria-current="${x.slug === t.slug}">${esc(x.me)}<b>${x.count}</b></button>`).join('');

    const rows = E.filter(e => matches(t, e));
    const fresh = rows.filter(e => e.date >= weekAgo).length;
    document.getElementById('headline').textContent = `${rows.length} Minneapolis places may need you right now.`;
    document.getElementById('sub2').textContent =
      `Each one changed in the last ${D.window_days} days. That is when a business picks new vendors.` + (fresh ? ` ${fresh} new this week.` : '');
    document.getElementById('csv').href = `data/${t.slug}.csv`;

    const shown = rows;
    document.getElementById('rows').innerHTML = shown.map(e => {
      const addr = [e.address, e.city].filter(Boolean).join(', ');
      const why = t.why[e.event] || '';
      return `<article class="row" style="--c:var(--t-${e.event})">
        <div class="top"><span class="when">${esc(WHEN[e.stage] || e.stage)}</span>
          <span class="date">${esc(fmt(e.date))}${e.date >= weekAgo ? '<span class="new">NEW</span>' : ''}</span></div>
        <div class="name">${esc(title(e))}</div>
        ${e.name ? `<div class="who">${esc(e.name)}</div>` : ''}
        ${addr ? `<div class="addr">${esc(addr)}</div>` : ''}
        <p class="story">${esc(story(e))}</p>
        ${why ? `<p class="foryou"><strong>For you:</strong> ${esc(why)}</p>` : ''}
        ${askFor(e)}
        <details><summary>See the record</summary>
          <p>${esc(T[e.event].label)} · ${esc(e.stage)} · ${esc(fmt(e.date))}</p>
          ${e.detail ? `<p>${esc(e.detail)}</p>` : ''}
          <p><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.source)} &rarr;</a></p>
        </details>
      </article>`;
    }).join('');
  }

  const sheet = document.getElementById('sheet');
  const openSheet = () => { sheet.hidden = false; sheet.querySelector('[aria-current=true]')?.focus(); };
  const closeSheet = () => { sheet.hidden = true; };
  document.getElementById('me').addEventListener('click', openSheet);
  document.getElementById('x').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.getElementById('opts').addEventListener('click', e => {
    const b = e.target.closest('.o'); if (!b) return; closeSheet(); location.hash = b.dataset.slug;
  });

  function route(){
    const t = D.trades.find(t => t.slug === location.hash.slice(1)) || D.trades.find(t => t.slug === DEFAULT) || D.trades[0];
    draw(t);
    document.title = `${t.name} · Buying Window`;
  }
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); });
  route();
})();
</script>
</body>
</html>
