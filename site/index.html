<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buying Window</title>
<meta name="description" content="Pick what you sell. See the Minneapolis businesses that just started needing it, from public records: build-outs, new liquor licenses, first health inspections, teardowns and layoff notices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1b1a17; --muted:#6b675e; --line:#e3dfd5;
  --accent:#1f5f4a; --accent-ink:#ffffff; --chip:#ece8de;
  --t-buildout:#2f5d8a; --t-liquor:#8a3f6a; --t-first_inspection:#1f7a4a; --t-wrecking:#8a5a1f; --t-warn:#8a2f2f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1f1e1b; --ink:#f1eee7; --muted:#a39e93; --line:#33312c;
    --accent:#5fbf98; --accent-ink:#0e1a15; --chip:#2a2925;
    --t-buildout:#7fb0e0; --t-liquor:#e09ac4; --t-first_inspection:#7fd3a3; --t-wrecking:#e0b47f; --t-warn:#e48b8b;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1f1e1b; --ink:#f1eee7; --muted:#a39e93; --line:#33312c;
  --accent:#5fbf98; --accent-ink:#0e1a15; --chip:#2a2925;
  --t-buildout:#7fb0e0; --t-liquor:#e09ac4; --t-first_inspection:#7fd3a3; --t-wrecking:#e0b47f; --t-warn:#e48b8b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:28px;line-height:1.15;margin:8px 0 8px;letter-spacing:-.02em}
.lede{color:var(--muted);margin:0 0 20px;font-size:16px}
label.q{display:block;font-weight:600;font-size:18px;margin:0 0 8px}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:14px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
input[type=search]:focus{border-color:var(--accent)}
.group{margin:18px 0 0}
.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.trades{display:flex;flex-wrap:wrap;gap:8px}
.trade{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;border-radius:999px;cursor:pointer;min-height:44px;text-align:left}
.trade b{font-weight:600;color:var(--accent);margin-left:6px}
.trade:hover{border-color:var(--accent)}
.empty{color:var(--muted);padding:12px 0}
#list{display:none}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:8px 0;cursor:pointer;min-height:44px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 6px}
.head h1{margin:0}
.dl{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:10px 14px;border-radius:10px;min-height:44px}
.sum{color:var(--muted);margin:6px 0 14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;min-height:40px}
.f[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tag{font-size:13px;font-weight:600;color:var(--c)}
.date{font-size:13px;color:var(--muted);white-space:nowrap}
.name{font-weight:700;font-size:17px;margin:4px 0 0;overflow-wrap:anywhere}
.addr{color:var(--ink);margin:2px 0 0}
.stage{display:inline-block;background:var(--chip);border-radius:6px;font-size:13px;font-weight:600;padding:3px 8px;margin:8px 0 0}
.why{font-size:14px;color:var(--muted);margin:8px 0 0}
.detail{font-size:14px;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.src{display:inline-block;font-size:14px;color:var(--accent);margin:8px 0 0;min-height:24px}
.new{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
footer{color:var(--muted);font-size:13px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <section id="pick">
    <h1>Find the businesses that just started needing you.</h1>
    <p class="lede" id="lede">&nbsp;</p>
    <label class="q" for="s">What do you sell?</label>
    <input id="s" type="search" placeholder="Try: bookkeeping, signs, linen, staffing" autocomplete="off">
    <div id="groups"></div>
  </section>

  <section id="list">
    <button class="back" id="back">&larr; Pick a different trade</button>
    <div class="head"><h1 id="tname"></h1><a class="dl" id="csv" download>Download CSV</a></div>
    <p class="sum" id="tsum"></p>
    <div class="filters" id="filters"></div>
    <div id="rows"></div>
  </section>

  <footer id="foot"></footer>
</div>
<script>
(async function(){
  const D = await (await fetch('data/events.json')).json();
  const T = D.triggers, E = D.events;
  const built = new Date(D.built + 'T12:00:00');
  const fmt = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  const weekAgo = new Date(built.getTime() - 7*864e5).toISOString().slice(0,10);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const matches = (t, e) => t.triggers.some(([ev, segs]) => e.event === ev && (!segs.length || segs.includes(e.segment)));

  const sources = Object.keys(T).filter(k => D.counts[k]).map(k => T[k].label.toLowerCase());
  document.getElementById('lede').textContent =
    `Pick your trade. Get the list of Minneapolis-area businesses that hit a change in the last ${D.window_days} days — ` +
    `${E.length} so far, from city and state records. Newest first.`;
  document.getElementById('foot').innerHTML =
    `Built ${fmt(D.built)} from public records: Minneapolis building permits, liquor licenses and food inspections, and Minnesota DEED layoff notices. ` +
    `Free. No sign-up. <a href="https://github.com/2016judea/buying-window">How it works</a>.`;

  // ---- picker
  const groups = {};
  D.trades.forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  function drawPicker(q){
    q = (q || '').trim().toLowerCase();
    let html = '', n = 0;
    for (const [g, ts] of Object.entries(groups)){
      const hit = ts.filter(t => !q || t.name.toLowerCase().includes(q) || g.toLowerCase().includes(q));
      if (!hit.length) continue;
      n += hit.length;
      html += `<div class="group"><h2>${esc(g)}</h2><div class="trades">` +
        hit.map(t => `<button class="trade" data-slug="${t.slug}">${esc(t.name)}<b>${t.count}</b></button>`).join('') +
        `</div></div>`;
    }
    document.getElementById('groups').innerHTML = n ? html : `<p class="empty">Nothing matches that yet. Try a broader word, like "food" or "office".</p>`;
  }
  document.getElementById('s').addEventListener('input', e => drawPicker(e.target.value));
  document.getElementById('groups').addEventListener('click', e => {
    const b = e.target.closest('.trade'); if (b) location.hash = b.dataset.slug;
  });
  drawPicker('');

  // ---- list
  let filter = 'all';
  function drawList(t){
    const rows = E.filter(e => matches(t, e));
    const kinds = t.triggers.map(([ev]) => ev).filter(k => rows.some(e => e.event === k));
    const fresh = rows.filter(e => e.date >= weekAgo).length;
    document.getElementById('tname').textContent = t.name;
    document.getElementById('csv').href = `data/${t.slug}.csv`;
    document.getElementById('tsum').textContent =
      `${rows.length} leads from the last ${D.window_days} days` + (fresh ? `, ${fresh} in the last week.` : '.');
    const fb = [['all', `All ${rows.length}`], ...kinds.map(k => [k, `${T[k].short} ${rows.filter(e => e.event === k).length}`])];
    if (!kinds.includes(filter)) filter = 'all';
    document.getElementById('filters').innerHTML = kinds.length > 1 ? fb.map(([k, l]) =>
      `<button class="f" data-k="${k}" aria-pressed="${k === filter}">${esc(l)}</button>`).join('') : '';
    const shown = rows.filter(e => filter === 'all' || e.event === filter);
    document.getElementById('rows').innerHTML = shown.map(e => {
      const title = e.name || e.address;
      const addr = e.name ? [e.address, e.city].filter(Boolean).join(', ') : e.city;
      const why = t.why[e.event] || '';
      return `<article class="row" style="--c:var(--t-${e.event})">
        <div class="top"><span class="tag">${esc(T[e.event].label)}${e.kind === 'Remodel' ? ' (remodel)' : ''}</span>
          <span class="date">${esc(fmt(e.date))}${e.date >= weekAgo ? '<span class="new">NEW</span>' : ''}</span></div>
        <div class="name">${esc(title)}</div>
        ${addr ? `<div class="addr">${esc(addr)}</div>` : ''}
        <span class="stage">${esc(e.stage)}</span>
        ${why ? `<p class="why">${esc(why)}</p>` : ''}
        ${e.detail ? `<p class="detail">${esc(e.detail)}${e.by ? ` · Filed by ${esc(e.by)}` : ''}</p>` : ''}
        <a class="src" href="${esc(e.source_url)}" target="_blank" rel="noopener">See the record: ${esc(e.source)} &rarr;</a>
      </article>`;
    }).join('');
  }
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('.f'); if (!b) return;
    filter = b.dataset.k; route();
  });
  document.getElementById('back').addEventListener('click', () => { history.pushState('', '', location.pathname); route(); });

  function route(){
    const t = D.trades.find(t => t.slug === location.hash.slice(1));
    document.getElementById('pick').style.display = t ? 'none' : 'block';
    document.getElementById('list').style.display = t ? 'block' : 'none';
    if (t){ drawList(t); document.title = `${t.name} · Buying Window`; }
    else document.title = 'Buying Window';
  }
  window.addEventListener('hashchange', () => { filter = 'all'; route(); window.scrollTo(0,0); });
  route();
})();
</script>
</body>
</html>
